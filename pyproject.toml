[project]
name = "travel-planner-agent"
version = "0.1.0"
description = "Multi-constraint multimodal travel planning research prototype"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
